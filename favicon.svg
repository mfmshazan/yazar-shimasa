<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Burgundy circle background -->
  <circle cx="16" cy="16" r="16" fill="#5E2B33"/>

  <!-- YS monogram in champagne gold -->
  <text x="16" y="17" fill="#CBB076"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="16" font-weight="700" letter-spacing="0.5"
        text-anchor="middle" dominant-baseline="central">YS</text>

  <!-- Thin gold ring to frame -->
  <circle cx="16" cy="16" r="15"
          fill="none" stroke="#B08D45" stroke-width="0.6" opacity="0.6"/>
</svg>
